
<html lang='es'>
<head>
    <meta charset='UTF-8'>
    <title>Agente Proveedor</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; }
        #chat { height: 400px; border: 1px solid #000; overflow-y: scroll; padding: 10px; background: #eee; white-space: pre-wrap; font-family: monospace; }
        .input-row { display: flex; gap: 10px; margin-top: 10px; }
        input { flex-grow: 1; padding: 10px; }
        button { padding: 10px 20px; cursor: pointer; }
    </style>
</head>
<body>
    <h3>Agente Registro Proveedor</h3>
    <div id='chat'></div>
    <div class='input-row'>
        <input id='msg' placeholder='Escribe tu mensaje...' onkeypress='if(event.key===\"Enter\")send()'>
        <button onclick='send()'>Enviar</button>
    </div>
    <script>
        const chatDiv = document.getElementById('chat');
        const msgInput = document.getElementById('msg');
        function addMsg(text, cls) {
            const div = document.createElement('div');
            div.className = cls;
            div.innerText = text;
            chatDiv.appendChild(div);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
        async function send() {
            const text = msgInput.value;
            if (!text) return;
            addMsg('> Tu: ' + text, 'user');
            msgInput.value = '';
            const botDiv = document.createElement('div');
            botDiv.className = 'bot';
            botDiv.innerText = '> Agente: Pensando...';
            chatDiv.appendChild(botDiv);
            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await res.json();
                if(data.reply) {
                    botDiv.innerText = '> Agente: ' + data.reply;
                } else if(data.error) {
                    botDiv.innerText = '> Error: ' + data.error;
                }
            } catch (e) {
                botDiv.innerText = '> Error de red.';
            }
        }
    </script>
</body>
</html>
